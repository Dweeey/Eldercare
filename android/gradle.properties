org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Allow Gradle to auto-download a matching JDK toolchain when none is available
org.gradle.java.installations.auto-download=true
## Configure repositories Gradle can use to download Java toolchains
# Use Maven Central and Gradle distributions as fallbacks
org.gradle.java.installations.download.repos=https://repo1.maven.org/maven2,https://services.gradle.org/distributions
# Handle native assets compilation with spaces in paths (Windows username issue)
org.gradle.workers.max=4
